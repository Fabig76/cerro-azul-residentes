<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Administrativo — Cerro Azul</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    /* Estilos especificos del portal admin */
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .admin-header {
      background: var(--azul-osc, #004A99);
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-header h1 { font-size: 1.3em; margin: 0; }
    .admin-header .badge { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px; font-size: 0.85em; }

    .login-card {
      max-width: 420px;
      margin: 60px auto;
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .login-card h2 { color: var(--azul-osc, #004A99); margin-bottom: 8px; }
    .login-card .subtitle { color: var(--texto-med, #6C757D); font-size: 0.92em; margin-bottom: 20px; }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-bar input { flex: 1; padding: 10px 14px; font-size: 15px; }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border-radius: 8px;
      overflow: hidden;
    }
    .results-table th {
      background: var(--azul-clr, #EAF2FF);
      color: var(--azul-osc, #004A99);
      padding: 10px 12px;
      text-align: left;
      font-size: 0.9em;
      font-weight: 600;
    }
    .results-table td { padding: 10px 12px; border-bottom: 1px solid var(--gris-bd, #DEE2E6); font-size: 0.92em; }
    .results-table tr { cursor: pointer; transition: background 0.15s; }
    .results-table tr:hover { background: var(--azul-clr, #EAF2FF); }
    .results-table tr.selected { background: var(--azul-clr, #EAF2FF); font-weight: 600; }

    .detail-card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-top: 16px;
    }
    .detail-card h3 { color: var(--azul-osc, #004A99); margin: 0 0 16px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: span 2; }
    .form-grid label { font-size: 0.85em; color: var(--texto-med, #6C757D); }
    .form-grid input { width: 100%; padding: 8px 10px; font-size: 14px; }
    .form-grid input:disabled { background: var(--gris-bg, #F8F9FA); color: var(--texto-med, #6C757D); }

    .action-bar { display: flex; gap: 10px; margin-top: 20px; }
    .meta-info {
      background: var(--gris-bg, #F8F9FA);
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.92em;
      color: var(--texto-med, #6C757D);
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: var(--texto-med, #6C757D);
      background: white;
      border-radius: 8px;
    }

    .log { background: #f5f5f5; padding: 8px 12px; border-radius: 4px; font-family: monospace; font-size: 0.82em; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="admin-wrap">

  <!-- HEADER -->
  <div class="admin-header">
    <h1>🔧 Portal Administrativo — Cerro Azul</h1>
    <span class="badge" id="sessionBadge" style="display:none">Sesión activa</span>
  </div>

  <!-- ALERTAS -->
  <div id="alert" class="alert hidden" role="alert"></div>

  <!-- VISTA 1: LOGIN -->
  <div id="view-login" class="login-card">
    <h2>Iniciar sesión</h2>
    <p class="subtitle">Solo personal autorizado de la administración.</p>
    <div class="field" style="margin-bottom:14px;">
      <label>Contraseña</label>
      <input type="password" id="loginPassword" placeholder="Ingrese la contraseña" autocomplete="current-password">
    </div>
    <button type="button" class="btn btn-primary btn-block" id="btnLogin">Ingresar</button>
    <p style="margin-top:14px; font-size:12px; color:var(--gris-med);">
      ¿Olvidó la contraseña? Edite la celda <strong>Config!B2</strong> en el Google Sheet.
    </p>
  </div>

  <!-- VISTA 2: PANEL -->
  <div id="view-panel" class="hidden">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar por apto, nombre, cédula, correo, celular o CA-XXXX...">
      <button type="button" class="btn btn-primary" id="btnSearch">🔍 Buscar</button>
      <button type="button" class="btn btn-secondary" id="btnLogout">Cerrar sesión</button>
    </div>

    <div id="resultsContainer"></div>

    <div id="detailContainer"></div>
  </div>

</div>

<script src="js/admin.js"></script>

</body>
</html>
